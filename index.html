<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffeef2" />
<title>约会邀请</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #3b3336;
    background:
      radial-gradient(circle at 15% 18%, rgba(255, 190, 210, 0.55), transparent 42%),
      radial-gradient(circle at 85% 12%, rgba(210, 195, 255, 0.50), transparent 40%),
      radial-gradient(circle at 78% 88%, rgba(255, 210, 225, 0.55), transparent 45%),
      radial-gradient(circle at 18% 90%, rgba(255, 230, 190, 0.45), transparent 42%),
      linear-gradient(160deg, #fff5f8 0%, #ffe9f0 38%, #f3ecff 72%, #eef4ff 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }

  /* ===== 背景装饰层 ===== */
  .bg-decor {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }

  /* 柔和光晕球 */
  .bg-decor .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(50px);
    opacity: 0.55;
    animation: floatGlow 14s ease-in-out infinite;
  }
  @keyframes floatGlow {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(22px, -30px) scale(1.15); }
  }

  /* 闪烁小星星 */
  .bg-decor .star {
    position: absolute;
    color: #ffffff;
    text-shadow: 0 0 6px rgba(255, 200, 220, 0.9);
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.8); }
    50%      { opacity: 1;    transform: scale(1.25); }
  }

  /* 漂浮爱心 / 花瓣 */
  .bg-decor .float {
    position: absolute;
    bottom: -70px;
    animation: rise linear infinite;
  }
  @keyframes rise {
    to { transform: translateY(-120vh) rotate(35deg); }
  }

  /* 卡片主体 */
  .card {
    position: relative; z-index: 1;
    width: min(400px, 100%);
    padding: 46px 30px 42px;
    text-align: center;
    background: #fff;
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 24px 60px -22px rgba(214, 130, 150, 0.45), 0 4px 14px rgba(120, 90, 110, 0.06);
  }

  /* 页面切换控制 */
  .stage { display: none; }
  .stage.active {
    display: block;
    animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
  }

  .kicker {
    font-size: 0.68rem; letter-spacing: 0.32em; text-indent: 0.32em;
    text-transform: uppercase; color: #f0879f; margin-bottom: 20px;
  }

  h1 {
    font-size: clamp(1.45rem, 6vw, 1.8rem);
    font-weight: 600; line-height: 1.55;
  }

  .sub {
    margin-top: 14px; font-size: 0.9rem; line-height: 1.9; color: #9b8d94;
  }

  /* 按钮 */
  .btns {
    display: flex; flex-wrap: wrap; justify-content: center;
    align-items: center; gap: 12px; margin-top: 34px;
    min-height: 50px;
  }

  .btn {
    font: inherit; font-size: 0.95rem; letter-spacing: 0.06em;
    padding: 14px 30px; border: 0; border-radius: 999px; cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.3s ease, background 0.3s ease, color 0.3s ease,
                left 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                top 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .yes {
    color: #fff; background: linear-gradient(135deg, #ff96ac, #ff6b8a);
    box-shadow: 0 12px 26px -10px rgba(255, 107, 138, 0.85);
  }
  .yes:hover { transform: translateY(-3px); }
  .yes:active { transform: translateY(-1px) scale(0.98); }

  .no {
    color: #978a91; background: #f6f2f3;
  }
  .no:hover { background: #efe9eb; }

  /* 逃跑中的按钮：脱离父级，固定在视口上 */
  .no.flying {
    position: fixed;
    z-index: 9999;
    margin: 0;
    box-shadow: 0 14px 30px -10px rgba(150, 130, 140, 0.55);
    will-change: left, top;
  }

  .ghost {
    color: #a2959c; background: transparent;
    border: 1px solid #ecdfe3; padding: 12px 26px;
  }
  .ghost:hover { color: #ff6b8a; border-color: #ffc2cf; }

  /* 成功页面 */
  .heart {
    font-size: 2.4rem; line-height: 1; color: #ff7d99; margin-bottom: 18px;
    animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.4); }
  }

  /* 失望页面表情 */
  .sad-face {
    font-size: 4.4rem; line-height: 1; margin-bottom: 20px;
    animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .detail {
    margin: 26px 0 30px; border-top: 1px solid #f3eaec; border-bottom: 1px solid #f3eaec; padding: 4px 0;
  }
  .detail > div {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; padding: 13px 4px;
  }
  .detail > div + div { border-top: 1px dashed #f6eef0; }
  .detail dt { font-size: 0.78rem; letter-spacing: 0.14em; color: #b0a2a9; flex: none; }
  .detail dd { font-size: 0.94rem; font-weight: 600; color: #3b3336; text-align: right; }

  @media (prefers-reduced-motion: reduce) {
    .bg-decor .glow,
    .bg-decor .star,
    .bg-decor .float,
    .stage.active, .heart, .sad-face { animation: none; }
    .btn { transition: none; }
  }
</style>
</head>
<body>

<div class="bg-decor" id="bgDecor" aria-hidden="true"></div>

<main class="card">

  <!-- 第一步 · 1A -->
  <section class="stage active" id="stage1a">
    <p class="kicker">Step 1 / 3</p>
    <h1>这个周末<br />有空吗？</h1>
    <p class="sub">想约你</p>
    <div class="btns">
      <button class="btn yes" data-next="stage2">有空</button>
      <button class="btn no" data-next="stage1b">没空</button>
    </div>
  </section>

  <!-- 第一步 · 1B -->
  <section class="stage" id="stage1b">
    <p class="kicker">Step 1 / 3</p>
    <h1>真的没空吗？</h1>
        <div class="btns">
      <button class="btn yes" data-next="stage2">骗你的！</button>
      <button class="btn no" data-next="stage1c">真的</button>
    </div>
  </section>

  <!-- 第一步 · 1C -->
  <section class="stage" id="stage1c">
    <div class="sad-face" aria-hidden="true">😞</div>
    <h1>好吧……</h1>
    <p class="sub">那就改天吧<br />等你约我</p>
  </section>

  <!-- 第二步：约吗 -->
  <section class="stage" id="stage2">
    <p class="kicker">Step 2 / 3</p>
    <h1>约吗？</h1>
    <p class="sub">想和你一起度过</p>
    <div class="btns" id="btnsStage2">
      <button class="btn yes" data-next="stage3">约！</button>
      <button class="btn no" id="noBtn2">不约</button>
    </div>
  </section>

  <!-- 第三步：选时间 -->
  <section class="stage" id="stage3">
    <p class="kicker">Step 3 / 3</p>
    <h1>什么时候？</h1>
    <p class="sub">选个时间吧</p>
    <div class="btns">
      <button class="btn yes" data-day="周六">周六</button>
      <button class="btn yes" data-day="周天">周天</button>
    </div>
  </section>

  <!-- 成功页面 -->
  <section class="stage" id="stageDone">
    <div class="heart" aria-hidden="true">♡</div>
    <h1>那就说定啦！</h1>
    <p class="sub" id="finalSub">周六或周天见</p>
    <dl class="detail">
      <div>
        <dt>时间</dt>
        <dd id="finalDay">周六</dd>
      </div>
      <div>
        <dt>地点</dt>
        <dd>跟着我走就OK啦！</dd>
      </div>
  </section>

</main>

<script>
(function () {
  'use strict';

  /* ---------- 背景装饰：光晕 + 星光 + 花瓣 ---------- */
  (function () {
    var decor = document.getElementById('bgDecor');
    if (!decor) return;

    var i, el;

    // 1) 柔和光晕球
    var glowColors = [
      'rgba(255, 182, 203, 0.65)',
      'rgba(198, 183, 255, 0.55)',
      'rgba(255, 214, 165, 0.50)',
      'rgba(170, 216, 255, 0.45)'
    ];
    for (i = 0; i < 4; i++) {
      el = document.createElement('span');
      el.className = 'glow';
      var size = 130 + Math.random() * 170;
      el.style.width  = size.toFixed(0) + 'px';
      el.style.height = size.toFixed(0) + 'px';
      el.style.left   = (Math.random() * 85).toFixed(1) + '%';
      el.style.top    = (Math.random() * 85).toFixed(1) + '%';
      el.style.background = glowColors[i % glowColors.length];
      el.style.animationDelay    = (-Math.random() * 14).toFixed(1) + 's';
      el.style.animationDuration = (12 + Math.random() * 8).toFixed(1) + 's';
      decor.appendChild(el);
    }

    // 2) 闪烁小星星
    var starGlyphs = ['✦', '✧', '·', '✩', '⋆'];
    for (i = 0; i < 20; i++) {
      el = document.createElement('span');
      el.className = 'star';
      el.textContent = starGlyphs[i % starGlyphs.length];
      el.style.left = (Math.random() * 100).toFixed(1) + '%';
      el.style.top  = (Math.random() * 100).toFixed(1) + '%';
      el.style.fontSize = (8 + Math.random() * 10).toFixed(0) + 'px';
      el.style.animationDelay    = (-Math.random() * 3).toFixed(1) + 's';
      el.style.animationDuration = (2 + Math.random() * 2.5).toFixed(1) + 's';
      decor.appendChild(el);
    }

    // 3) 漂浮爱心 / 花瓣
    var floatGlyphs = ['♡', '♥', '❀', '✿', '❁', '✾'];
    for (i = 0; i < 18; i++) {
      el = document.createElement('span');
      el.className = 'float';
      el.textContent = floatGlyphs[i % floatGlyphs.length];
      el.style.left = (Math.random() * 100).toFixed(1) + '%';
      el.style.fontSize = (12 + Math.random() * 24).toFixed(0) + 'px';
      el.style.opacity  = (0.28 + Math.random() * 0.5).toFixed(2);
      el.style.color = Math.random() > 0.5 ? '#ffffff' : '#ffc6d6';
      el.style.animationDuration = (12 + Math.random() * 12).toFixed(1) + 's';
      el.style.animationDelay    = (-Math.random() * 24).toFixed(1) + 's';
      decor.appendChild(el);
    }
  })();

  /* ---------- 页面切换 ---------- */
  var stages = document.querySelectorAll('.stage');

  function show(id) {
    stages.forEach(function (el) { el.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
    if (id !== 'stage2' && typeof window.__resetNoBtn === 'function') {
      window.__resetNoBtn();
    }
  }

  /* ---------- 通用“下一步”按钮 ---------- */
  document.querySelectorAll('[data-next]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      show(btn.getAttribute('data-next'));
    });
  });

  /* ---------- 选择时间 ---------- */
  document.querySelectorAll('[data-day]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var day = btn.getAttribute('data-day');
      document.getElementById('finalDay').textContent = day;
      document.getElementById('finalSub').textContent = day + '见';
      show('stageDone');
    });
  });

  /* ---------- 第二步：“不约”按钮逃跑 ---------- */
  (function () {
    var btn     = document.getElementById('noBtn2');
    var parent  = btn.parentNode;
    var nextSib = btn.nextSibling;
    var texts   = ['不约', '诶？跑掉了', '抓不到我～', '再想想嘛', '别点啦 😜'];
    var n       = 0;
    var isFlying = false;

    // 占位符，保证按钮飞走后，“约！”按钮位置不变
    var ph = document.createElement('span');
    ph.style.display = 'none';
    ph.style.width   = btn.offsetWidth  + 'px';
    ph.style.height  = btn.offsetHeight + 'px';
    parent.insertBefore(ph, btn);

    // 取视口尺寸（取小值，避免移动端地址栏误差）
    function viewport() {
      var w = Math.min(
        document.documentElement.clientWidth  || 9999,
        window.innerWidth || 9999
      );
      var h = Math.min(
        document.documentElement.clientHeight || 9999,
        window.innerHeight || 9999
      );
      return { w: w, h: h };
    }

    function moveToRandom() {
      var vp  = viewport();
      var bw  = btn.offsetWidth  || 90;
      var bh  = btn.offsetHeight || 48;
      var pad = 16;
      var maxX = Math.max(pad, vp.w - bw - pad);
      var maxY = Math.max(pad, vp.h - bh - pad);
      var x = pad + Math.random() * (maxX - pad);
      var y = pad + Math.random() * (maxY - pad);
      btn.style.left = x + 'px';
      btn.style.top  = y + 'px';
    }

    btn.addEventListener('click', function (e) {
      e.preventDefault();

      // 换文案
      if (n < texts.length - 1) {
        n++;
        btn.textContent = texts[n];
      }

      // 第一次点击：搬到 body 下，切换为 fixed
      if (!isFlying) {
        var r = btn.getBoundingClientRect();

        ph.style.width  = r.width  + 'px';
        ph.style.height = r.height + 'px';
        ph.style.display = 'inline-block';

        document.body.appendChild(btn);
        isFlying = true;
        btn.classList.add('flying');

        btn.style.left = r.left + 'px';
        btn.style.top  = r.top  + 'px';

        requestAnimationFrame(function () {
          requestAnimationFrame(moveToRandom);
        });
        return;
      }

      moveToRandom();
    });

    // 归位
    window.__resetNoBtn = function () {
      if (!isFlying) return;

      btn.classList.remove('flying');
      btn.style.left = '';
      btn.style.top  = '';
      btn.textContent = '不约';
      n = 0;
      isFlying = false;
      ph.style.display = 'none';

      if (nextSib && nextSib.parentNode === parent) {
        parent.insertBefore(btn, nextSib);
      } else {
        parent.appendChild(btn);
      }
    };
  })();

  /* ---------- 重置 ---------- */
  function resetAll() {
    if (typeof window.__resetNoBtn === 'function') window.__resetNoBtn();
    show('stage1a');
  }

  document.getElementById('restart1').addEventListener('click', resetAll);
  document.getElementById('restartBtn').addEventListener('click', resetAll);

})();
</script>
</body>
</html>
